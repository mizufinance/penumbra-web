---
name: Build container image
on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
jobs:
  veil-testnet:
    runs-on: buildjet-16vcpu-ubuntu-2204
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to the Docker Hub container registry (for pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry (for pushes)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mizufinance/veil

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          file: ci/containerfiles/Containerfile-veil
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/mizufinance/veil:testnet
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=https://dex-explorer.testnet.plinfra.net

  veil-mainnet:
    runs-on: buildjet-16vcpu-ubuntu-2204
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to the Docker Hub container registry (for pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry (for pushes)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mizufinance/veil

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          file: ci/containerfiles/Containerfile-veil
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/mizufinance/veil:mainnet
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=https://dex-explorer.mainnet.plinfra.net
